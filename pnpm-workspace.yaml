packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@iconify-json/lucide": ^1.2.144
  "@nanostores/persistent": ^1.3.5
  "@nanostores/vue": ^1.1.0
  "@types/node": ^24
  "@vitejs/plugin-vue": ^6.0.10
  nanostores: ^1.5.5
  typescript: ^7.0.2
  unocss: ^66.11.0
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vue: ^3.5.44
  vue-tsc: ^3.3.13
# TypeScript 7 has no JS compiler API. vue-tsc and @vue/compiler-sfc (imported
# prop types in defineProps) need one, so @arena/app pins `typescript` to 5.9.
# `vp check` keeps type-checking .ts files with TS 7 through tsgolint.
catalogs:
  typescript5:
    typescript: ~5.9.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0"
  - vite-plus@1.2.0
